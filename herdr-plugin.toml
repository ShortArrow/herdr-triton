id = "shortarrow.herdr-triton"
name = "herdr-triton"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Jump to, select and confirm waiting agents' prompts from an RP2040 three-key keypad"
platforms = ["linux", "macos", "windows"]

# `herdr plugin install` runs this; after `herdr plugin link`, run it by hand.
[[build]]
command = ["cargo", "install", "--locked", "--path", "bridge", "--bin", "bridge", "--root", ".plugin"]

# ADR 0008: every hook tries to become the listener; the one that opens the
# keypad's port stays until nothing has waited for 5 s.
[[startup]]
platforms = ["windows"]
command = [".plugin/bin/bridge.exe", "hook"]

[[startup]]
platforms = ["linux", "macos"]
command = [".plugin/bin/bridge", "hook"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["windows"]
command = [".plugin/bin/bridge.exe", "hook"]

[[events]]
on = "pane.agent_status_changed"
platforms = ["linux", "macos"]
command = [".plugin/bin/bridge", "hook"]
