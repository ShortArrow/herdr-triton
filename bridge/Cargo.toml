[package]
name = "bridge"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Same named-pipe naming as herdr, which pins 2.4.
interprocess = "2.4"
protocol = { path = "../protocol" }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
keypad = { path = "../keypad" }
