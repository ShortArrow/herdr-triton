[package]
name = "bridge"
version = "0.1.0"
edition = "2021"
publish = false
license.workspace = true

# main.rs has no tests; a test build would only repeat its link
# arguments, such as the delay-loads of build.rs.
[[bin]]
name = "bridge"
path = "src/main.rs"
test = false

[dependencies]
protocol = { path = "../protocol" }
serialport = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The fake herdr binds its socket as herdr does, through interprocess 2.4.
interprocess = "2.4"
keypad = { path = "../keypad" }

[target.'cfg(windows)'.dev-dependencies]
# The busy-pipe tests create a single-instance pipe themselves.
windows-sys = { version = "0.59", features = ["Win32_System_IO"] }
