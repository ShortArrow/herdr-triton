name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: bridge, keypad, protocol
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  firmware:
    name: firmware
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: flip-link
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --release -p firmware --bins --target thumbv6m-none-eabi -- -D warnings
      - run: cargo build --release -p firmware --bins --target thumbv6m-none-eabi
