[workspace]
resolver = "2"
members = ["trident", "firmware", "keypad", "protocol"]
# firmware builds only for thumbv6m-none-eabi; see the aliases in .cargo/config.toml.
default-members = ["trident", "keypad", "protocol"]

[workspace.package]
license = "MIT OR Apache-2.0"

[profile.release]
debug = 2
lto = true
opt-level = "s"
# No unwinding tables or landing pads; nothing here catches a panic.
panic = "abort"
